<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Deep Tech Emerald Gradient -->
    <linearGradient id="dpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022113"/>
      <stop offset="45%" stop-color="#074e2d"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Collar Band Tech Gradient -->
    <linearGradient id="dpBeltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Agritech Leaf Vibrant Gradient -->
    <linearGradient id="dpLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- Horn Shading Gradient -->
    <linearGradient id="dpHornGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="dpPulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseAnimation {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.85; }
        50% { stroke-dashoffset: 12; opacity: 1; filter: drop-shadow(0 0 5px #4ade80); }
      }
      @keyframes beaconRing {
        0% { r: 2.2px; opacity: 0.9; }
        50% { r: 5px; opacity: 0.2; }
        100% { r: 2.2px; opacity: 0.9; }
      }
      .telemetry-pulse-line {
        stroke-dasharray: 24;
        animation: pulseAnimation 2.4s ease-in-out infinite;
      }
      .beacon-ring-anim {
        animation: beaconRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 60px 80.5px;
      }
    </style>
  </defs>

  <!-- Premium Squircle Shield Container with Soft Inner Shadow -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#dpBgGrad)" stroke="#4ade80" stroke-width="2.2" stroke-opacity="0.45"/>

  <!-- Concentric Tech Telemetry Orbit Rings -->
  <circle cx="60" cy="60" r="46" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="2 4" stroke-opacity="0.3" fill="none"/>
  <circle cx="60" cy="60" r="34" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.22" fill="none"/>

  <!-- Left Sweeping Buffalo / Cow Horn -->
  <path d="M 41 43 C 28 41 15 32 17 18 C 24 20 35 29 44 36 Z" 
        fill="url(#dpHornGrad)"/>
  <path d="M 18 19 C 25 21 34 29 42 36" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Right Sweeping Buffalo / Cow Horn -->
  <path d="M 79 43 C 92 41 105 32 103 18 C 96 20 85 29 76 36 Z" 
        fill="url(#dpHornGrad)"/>
  <path d="M 102 19 C 95 21 86 29 78 36" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Agritech Sprout / Leaf at Right Horn Crest -->
  <path d="M 83 23 C 83 12 97 9 104 6 C 104 19 94 27 83 23 Z" fill="url(#dpLeafGrad)"/>
  <path d="M 85 21 Q 95 15 103 7" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Animal Ears -->
  <path d="M 33 47 C 19 49 15 56 22 61 C 28 61 33 56 36 49 Z" fill="#f8fafc"/>
  <path d="M 23 54 C 21 57 24 59 27 58" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

  <path d="M 87 47 C 101 49 105 56 98 61 C 92 61 87 56 84 49 Z" fill="#f8fafc"/>
  <path d="M 97 54 C 99 57 96 59 93 58" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

  <!-- Animal Head & Face Contour -->
  <path d="M 42 35 C 50 31 70 31 78 35 C 83 48 81 68 71 78 C 65 83 55 83 49 78 C 39 68 37 48 42 35 Z" 
        fill="#ffffff" />

  <!-- Animal Crown Badge (Smart Pulse Diamond) -->
  <polygon points="60,40 64,46 60,52 56,46" fill="#16a34a"/>
  <circle cx="60" cy="46" r="1.5" fill="#4ade80"/>

  <!-- Intelligent Animal Eyes with Life Highlights -->
  <ellipse cx="48" cy="54" rx="2.5" ry="3.2" fill="#042918"/>
  <ellipse cx="72" cy="54" rx="2.5" ry="3.2" fill="#042918"/>
  <circle cx="47.2" cy="53" r="1" fill="#ffffff"/>
  <circle cx="71.2" cy="53" r="1" fill="#ffffff"/>

  <!-- Animal Muzzle / Nose Bridge -->
  <path d="M 52 70 C 52 66 68 66 68 70 C 68 76 52 76 52 70 Z" fill="#e2e8f0"/>
  <circle cx="56" cy="71.5" r="1.4" fill="#042918"/>
  <circle cx="64" cy="71.5" r="1.4" fill="#042918"/>

  <!-- SMART WEARABLE COLLAR / NECK BELT (THE SIGNATURE HARDWARE) -->
  <!-- Collar Strap Arch -->
  <path d="M 36 78 Q 60 91 84 78 L 86 87 Q 60 101 34 87 Z" 
        fill="url(#dpBeltGrad)" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Collar Texture Stitches -->
  <path d="M 38 80 Q 60 93 82 80" stroke="#042918" stroke-width="0.8" stroke-dasharray="2 2" fill="none" opacity="0.4"/>
  <path d="M 37 85 Q 60 98 83 85" stroke="#042918" stroke-width="0.8" stroke-dasharray="2 2" fill="none" opacity="0.4"/>

  <!-- Smart IoT Pod Central Housing -->
  <rect x="48" y="81.5" width="24" height="15" rx="4.5" fill="#031f13" stroke="#4ade80" stroke-width="1.8"/>

  <!-- IoT Telemetry LED Beacon (Pulse & Active Sensor) -->
  <circle class="beacon-ring-anim" cx="60" cy="79.5" r="2.2" stroke="#4ade80" stroke-width="1" fill="none"/>
  <circle cx="60" cy="79.5" r="2.2" fill="#22c55e"/>

  <!-- Dynamic Heartbeat Pulse Wave Line (ECG Telemetry) -->
  <path class="telemetry-pulse-line" 
        d="M 51 89 H 54.5 L 56.5 84.5 L 59.5 93.5 L 62.5 85.5 L 64.5 90.5 L 66 89 H 69" 
        stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" 
        filter="url(#dpPulseGlow)"/>
</svg>
